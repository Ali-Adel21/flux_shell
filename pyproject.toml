[project]
name = "flux-shell"
version = "0.1.0"
description = "A custom POSIX-like Unix shell built in Python"
readme = "README.md"
authors = [
    { name = "Ali-Adel21", email = "aliasharaf474@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
flyx-shell = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
